name: Mobile Apps CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: ${{ matrix.app }} app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [customer, seller, delivery]

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS runners
        run: |
          flutter create \
            --empty \
            --platforms=android,ios \
            --org com.mciedu.cnetstore \
            --project-name cnet_store_${{ matrix.app }} \
            .

      - name: Install dependencies
        run: flutter pub get

      - name: Format generated Flutter sources
        run: dart format lib test

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --fatal-infos 2>&1 | tee flutter-analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Flutter analyze failure: ${{ matrix.app }} app"
              echo '```text'
              tail -n 120 flutter-analyze.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=https://cnetstore.mciedu.com/api/v1 \
            --dart-define=FIREBASE_ENABLED=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cnet-store-${{ matrix.app }}-debug
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
