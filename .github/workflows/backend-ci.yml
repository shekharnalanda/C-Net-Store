name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Validate PHP syntax
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run automated tests
        shell: bash
        run: |
          set +e
          php artisan test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## Backend test failure'
              echo '```text'
              tail -120 test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            compact="$(tail -40 test-output.log | tr '\n' ' ' | cut -c1-3000)"
            echo "::error title=Backend tests failed::$compact"
          fi
          exit "$status"
